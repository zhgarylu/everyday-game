<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>墨字守营 · 回声游戏厅</title>
<style>
  :root { --ink: #1d1a16; --paper: #f3ead6; --paper2: #e6d8b8; --red: #b3261e; --red2: #d8452f; --gold: #d9a21b; --gold2: #f6d77a; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 35%, #3b3a33 0%, #1d1c18 60%, #0e0d0b 100%); }
  .kai { font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Songti SC", serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 450px; height: 800px; overflow: hidden; background: #e9dfc8; flex: none;
    box-shadow: 0 0 80px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 240, 210, .12); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* 顶栏 */
  #hud { position: absolute; left: 0; right: 0; top: 0; height: 58px; padding: 9px 10px 0; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .3s; }
  #hud.on { opacity: 1; }
  #hud::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: -1;
    background: linear-gradient(180deg, rgba(236,228,208,.92) 0%, rgba(236,228,208,.75) 70%, rgba(236,228,208,0) 100%); }
  .rb { pointer-events: auto; width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid #2a241c; color: #f6ecd4; cursor: pointer;
    background: linear-gradient(180deg, #3d352a, #1f1a14); font: 800 13px/1 inherit; font-family: inherit; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .15); }
  .rb:active { transform: scale(.92); }
  .rb.on { background: linear-gradient(180deg, #e0523a, #9c1e16); border-color: #5a0f0a; }
  .rb.off { opacity: .5; }
  .rb.kai { font-size: 17px; font-weight: 900; }
  #hudL { display: flex; gap: 5px; }
  #hudM { flex: 1; text-align: center; padding-top: 1px; }
  #hWave { font-size: 19px; font-weight: 900; letter-spacing: 2px; color: var(--ink); text-shadow: 0 1px 0 rgba(255, 250, 235, .8); }
  #hSub { font-size: 11px; color: #5a4a36; letter-spacing: 1px; margin-top: 1px; white-space: nowrap; }
  #hudR { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; width: 132px; }
  #hHp { display: flex; gap: 1.5px; align-items: center; font-size: 12px; font-weight: 900; color: var(--red); white-space: nowrap; }
  #hHp i { width: 6px; height: 10px; border-radius: 1.5px; background: var(--red); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
  #hHp i.x { background: rgba(80, 60, 40, .22); box-shadow: none; }
  #hHp i.hit { animation: hit .5s; }
  @keyframes hit { 0%, 60% { background: #fff; transform: scale(1.4); } }
  #hCoin { display: flex; align-items: center; gap: 4px; padding: 2px 9px 2px 5px; border-radius: 999px; background: rgba(30, 26, 20, .82); color: #f4f1e8;
    font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12); }
  #hCoin svg { width: 18px; height: 13px; }
  #hCoin.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.15); } }

  /* 通用浮层 */
  .ov { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px 18px; text-align: center; }
  .ov.on { display: flex; }
  #screen { background: radial-gradient(ellipse at 50% 40%, rgba(245, 236, 214, .9), rgba(214, 200, 170, .96) 80%); }
  #screen .tag { font-size: 12px; letter-spacing: 7px; color: var(--red); font-weight: 800; }
  #screen h1 { position: relative; margin: 10px 0 0; font-size: 70px; line-height: 1.05; letter-spacing: 8px; color: var(--ink); font-weight: 900;
    text-shadow: 2px 3px 0 rgba(0, 0, 0, .12); }
  #screen .seal { display: inline-block; margin-top: 6px; padding: 3px 9px; border: 2px solid var(--red); color: var(--red); border-radius: 4px; font-size: 15px; letter-spacing: 4px; transform: rotate(-3deg); font-weight: 900; }
  #screen .sub { font-size: 14px; margin: 12px 4px 12px; line-height: 1.85; color: #3a3024; }
  #screen .help { font-size: 12.5px; line-height: 1.9; text-align: left; display: inline-block; color: #2f281f;
    background: rgba(255, 250, 238, .7); border: 1px solid rgba(60, 40, 20, .25); border-radius: 8px; padding: 8px 14px; }
  #screen .help b { color: var(--red); }
  #screen .best { margin-top: 10px; font-size: 13px; color: #5a4630; }
  #screen table { margin: 12px auto 0; border-collapse: collapse; font-size: 15px; }
  #screen td { padding: 3px 14px; text-align: left; border-bottom: 1px dashed rgba(60, 40, 20, .18); }
  #screen td:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  #screen .big { font-size: 52px; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 4px; }
  #screen .rank { font-size: 20px; letter-spacing: 5px; color: var(--red); margin-top: 2px; font-weight: 900; }
  .go { margin-top: 18px; padding: 12px 48px; font-size: 23px; font-weight: 900; letter-spacing: 8px; cursor: pointer; border-radius: 8px; color: #fff6e2; font-family: inherit;
    border: 2px solid #5a0f0a; background: linear-gradient(180deg, #d8452f, #8f1a12); box-shadow: 0 5px 16px rgba(120, 20, 10, .45), inset 0 1px 0 rgba(255, 255, 255, .3); }
  .go:active { transform: scale(.96); }
  .go.s { padding: 9px 26px; font-size: 16px; letter-spacing: 3px; margin-left: 6px; background: linear-gradient(180deg, #3d352a, #1f1a14); border-color: #000; }
  #home { position: absolute; left: 12px; top: 12px; z-index: 30; display: none; align-items: center; height: 38px; padding: 0 14px; border-radius: 8px;
    background: rgba(30, 26, 20, .85); color: #f4efe2; font-size: 14px; text-decoration: none; }
  #screen.on ~ #home { display: flex; }

  #pause { background: rgba(28, 24, 18, .72); }
  #pause h2 { font-size: 36px; letter-spacing: 8px; color: #f3ead6; margin-bottom: 18px; }
  #pause button { display: block; width: 210px; margin: 8px auto; padding: 11px 0; border-radius: 8px; font-family: inherit; font-size: 17px; font-weight: 900; letter-spacing: 4px; cursor: pointer;
    border: 2px solid #5a0f0a; background: linear-gradient(180deg, #d8452f, #8f1a12); color: #fff6e2; }
  #pause button.s { background: rgba(243, 234, 214, .95); border-color: #3a3024; color: #2a241c; }

  /* 名录 */
  #book { background: rgba(28, 24, 18, .7); padding: 14px; z-index: 40; }
  #book .pg { width: 100%; max-height: 100%; overflow-y: auto; background: linear-gradient(180deg, #f6eedb, #eadcbc); border-radius: 10px; padding: 14px 14px 16px; text-align: left;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .5); border: 1px solid #b9a37c; }
  #book h2 { text-align: center; font-size: 28px; letter-spacing: 8px; }
  #book .tip { text-align: center; font-size: 12px; color: #6a5638; margin: 2px 0 10px; }
  .hero { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px dashed rgba(60, 40, 20, .25); }
  .hero .nm { flex: none; width: 76px; height: 42px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; letter-spacing: 2px; color: #1d1a16;
    background: linear-gradient(180deg, #fff6d8, #f0d893); border: 2px solid #b8861a; }
  .hero.lock .nm { filter: grayscale(1); opacity: .45; }
  .hero h4 { font-size: 15px; color: var(--red); }
  .hero h4 small { font-size: 11px; color: #7a6646; font-weight: 400; margin-left: 4px; }
  .hero p { font-size: 12px; line-height: 1.5; color: #3a3024; }
  .units { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
  .units div { display: flex; gap: 7px; align-items: center; font-size: 12px; line-height: 1.35; color: #3a3024; }
  .units b { flex: none; width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 21px; background: #fbf5e6; border: 1.5px solid #3a3024; }
  #book .close { display: block; margin: 12px auto 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="hudL">
      <button class="rb" id="bSpeed" title="倍速">x1</button>
      <button class="rb" id="bMute" title="声音 (M)">♪</button>
      <button class="rb" id="bPause" title="暂停 (P)">II</button>
      <button class="rb kai" id="bBook" title="名录 (B)">典</button>
    </div>
    <div id="hudM"><div id="hWave" class="kai">第一波</div><div id="hSub">&nbsp;</div></div>
    <div id="hudR">
      <div id="hHp"></div>
      <div id="hCoin"><svg viewBox="0 0 18 13"><path d="M1 6 Q2 12 9 12 Q16 12 17 6 Q13 8 9 8 Q5 8 1 6Z" fill="#cfd3d8" stroke="#555" stroke-width=".8"/><ellipse cx="9" cy="5.5" rx="4" ry="3.5" fill="#e9ecef" stroke="#555" stroke-width=".8"/></svg><span id="hCoinN">0</span></div>
    </div>
  </div>

  <div class="ov" id="pause">
    <h2 class="kai">鸣金暂歇</h2>
    <button id="pResume" class="kai">接着打</button>
    <button class="s kai" id="pRestart">重新开局</button>
    <button class="s kai" id="pHome">回游戏厅</button>
  </div>

  <div class="ov" id="book"><div class="pg" id="bookPg"></div></div>

  <div class="ov on" id="screen"></div>
  <a id="home" href="../">‹ 游戏厅</a>
</div>
<script src="game.js"></script>
</body>
</html>
