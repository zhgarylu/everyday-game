<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>烟花炸年兽 · 回声游戏厅</title>
<style>
  :root {
    --red: #c8102e; --deep: #12061a; --gold: #ffd24a; --gold2: #ffe9a0; --cream: #fff4dc; --cyan: #7df0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--cream);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #3a0c22 0%, #160614 55%, #07030a 100%); }
  .kai { font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 450px; height: 800px; overflow: hidden; background: #0a0716;
    box-shadow: 0 0 80px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 210, 74, .18); flex: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

  /* 顶部 HUD */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 10px 0; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .3s; }
  #hud.on { opacity: 1; }
  #hud::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 86px; background: linear-gradient(180deg, rgba(8, 2, 10, .78), rgba(8, 2, 10, 0)); z-index: -1; }
  .rb { pointer-events: auto; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(255, 210, 74, .55); color: var(--gold2); cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #5a1424, #250812); font: 800 12px/1 inherit; font-family: inherit; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .15); }
  .rb:active { transform: scale(.92); }
  .rb.on { background: linear-gradient(180deg, #ffe07a, #e0a020); color: #4a1000; }
  .rb.off { opacity: .55; }
  #hudL { display: flex; gap: 6px; }
  #hudR { flex: 1; display: flex; flex-direction: column; gap: 4px; max-width: 250px; margin-left: auto; }
  .row1 { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 800; text-shadow: 0 1px 3px #000; }
  .row1 b { color: var(--gold); letter-spacing: 1px; }
  .row1 span { font-variant-numeric: tabular-nums; color: var(--gold2); font-size: 12px; }
  #xp { position: relative; height: 17px; border-radius: 9px; background: rgba(20, 4, 10, .85); border: 1px solid rgba(255, 210, 74, .55); overflow: hidden; }
  #xpFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #b3101e, #ff4a2a 60%, #ffd24a); box-shadow: 0 0 12px rgba(255, 120, 40, .8); transition: width .12s; }
  #xpTxt { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 15px; font-weight: 900; text-shadow: 0 1px 2px #000; letter-spacing: 1px; }
  .row3 { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255, 240, 210, .85); text-shadow: 0 1px 2px #000; }
  .row3 strong { color: var(--gold); }

  #toast { position: absolute; left: 50%; top: 92px; transform: translate(-50%, -8px); padding: 6px 18px; border-radius: 6px; white-space: nowrap; z-index: 9;
    font-size: 17px; font-weight: 900; letter-spacing: 2px; color: #fff3c0; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    background: linear-gradient(90deg, rgba(160, 10, 30, 0), rgba(160, 10, 30, .92) 20%, rgba(160, 10, 30, .92) 80%, rgba(160, 10, 30, 0)); text-shadow: 0 2px 0 #4a0008; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 大礼花按钮 */
  #ult { position: absolute; right: 12px; bottom: 96px; width: 74px; height: 74px; border-radius: 50%; z-index: 10; cursor: pointer; display: none;
    border: 2px solid rgba(255, 210, 74, .5); background: #2a0a14; color: var(--gold2); font-family: inherit; overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .6); }
  #ult.on { display: block; }
  #ultFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, #c8102e, #ff6a2a 70%, #ffd24a); opacity: .85; }
  #ult b { position: relative; display: block; font-size: 20px; line-height: 1; letter-spacing: 1px; text-shadow: 0 2px 0 #4a0008; margin-top: 4px; }
  #ult small { position: relative; display: block; font-size: 10px; font-weight: 800; margin-top: 4px; }
  #ult.ready { border-color: #fff3a0; animation: pulse .7s ease-in-out infinite alternate; }
  #ult.ready #ultFill { opacity: 1; }
  @keyframes pulse { from { box-shadow: 0 0 10px rgba(255, 210, 74, .5); transform: scale(1); } to { box-shadow: 0 0 30px rgba(255, 210, 74, 1), 0 0 60px rgba(255, 90, 40, .7); transform: scale(1.07); } }

  /* 通用浮层 */
  .ov { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px 18px; text-align: center; }
  .ov.on { display: flex; }

  /* 标题 / 结算 */
  #screen { background: radial-gradient(ellipse at 50% 38%, rgba(70, 8, 30, .55), rgba(8, 3, 14, .9) 75%); }
  #screen .tag { font-size: 12px; letter-spacing: 7px; color: var(--gold); opacity: .9; }
  #screen h1 { margin: 8px 0 2px; font-size: 64px; line-height: 1.08; letter-spacing: 6px;
    background: linear-gradient(180deg, #fffbe0 15%, #ffd24a 52%, #ff4a2a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 110, 40, .65)) drop-shadow(0 4px 3px #000); }
  #screen .sub { font-size: 14px; margin: 10px 4px 12px; line-height: 1.8; color: rgba(255, 240, 215, .95); text-shadow: 0 1px 3px #000; }
  #screen .help { font-size: 12.5px; line-height: 1.95; text-align: left; display: inline-block; color: rgba(255, 236, 210, .92); text-shadow: 0 1px 3px #000;
    background: rgba(10, 3, 12, .55); border: 1px solid rgba(255, 210, 74, .25); border-radius: 10px; padding: 8px 14px; }
  #screen .help b { color: var(--gold); }
  #screen .best { margin-top: 10px; font-size: 13px; color: var(--gold2); }
  #screen table { margin: 12px auto 0; border-collapse: collapse; font-size: 15px; text-shadow: 0 1px 2px #000; }
  #screen td { padding: 3px 14px; text-align: left; }
  #screen td:last-child { text-align: right; font-weight: 800; color: var(--gold2); font-variant-numeric: tabular-nums; }
  #screen .big { font-size: 50px; font-weight: 900; color: var(--gold); text-shadow: 0 0 22px rgba(255, 170, 40, .6), 0 3px 6px #000; font-variant-numeric: tabular-nums; }
  #screen .rank { font-size: 19px; letter-spacing: 5px; color: var(--gold2); margin-top: 2px; }
  #screen .go { margin-top: 18px; padding: 13px 46px; font-size: 22px; font-weight: 900; letter-spacing: 8px; cursor: pointer; border-radius: 12px; color: #fff8d8; font-family: inherit;
    border: 2px solid var(--gold); background: linear-gradient(180deg, #e8243a, #8e0618); box-shadow: 0 6px 22px rgba(200, 16, 46, .6), inset 0 1px 0 rgba(255, 255, 255, .3); text-shadow: 0 2px 0 #4a0008; }
  #screen .go:active { transform: scale(.96); }
  #home { position: absolute; left: 12px; top: 12px; z-index: 30; display: none; align-items: center; height: 40px; padding: 0 14px; border-radius: 10px;
    background: rgba(10, 4, 14, .8); border: 1px solid rgba(255, 255, 255, .25); color: #fff; font-size: 14px; text-decoration: none; }
  #screen.on ~ #home { display: flex; }

  /* 升级三选一 */
  #lvl { background: rgba(10, 2, 10, .78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); justify-content: flex-start; padding-top: 56px; }
  #lvl h2 { font-size: 40px; letter-spacing: 8px; color: var(--gold); text-shadow: 0 0 20px rgba(255, 140, 40, .8), 0 3px 0 #5a0610; }
  #lvl .hint { font-size: 12px; color: rgba(255, 236, 210, .75); margin-top: 2px; letter-spacing: 2px; }
  #slots { display: flex; gap: 8px; margin: 14px 0 6px; }
  .slot { width: 56px; text-align: center; }
  .slot .box { width: 56px; height: 56px; border-radius: 10px; border: 1.5px dashed rgba(255, 210, 74, .35); background: rgba(40, 8, 18, .6); display: flex; align-items: center; justify-content: center; position: relative; }
  .slot .box.has { border-style: solid; border-color: rgba(255, 210, 74, .8); background: radial-gradient(circle at 50% 40%, #5a1424, #220610); }
  .slot .box.evo { border-color: #ffb0ff; box-shadow: 0 0 12px rgba(255, 140, 255, .55); }
  .slot svg { width: 44px; height: 44px; }
  .slot .lv { position: absolute; right: -5px; bottom: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--gold); color: #4a1000; font-size: 11px; font-weight: 900; line-height: 20px; }
  .slot .dots { display: flex; justify-content: center; gap: 2px; margin-top: 5px; }
  .slot .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .15); }
  .slot .dots i.f { background: var(--gold); box-shadow: 0 0 4px var(--gold); }
  .slot .dots i.e { background: #ff9cff; box-shadow: 0 0 4px #ff9cff; }
  #cards { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; margin-top: 10px; }
  .card { position: relative; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg, #fff1cf, #f3d79a); color: #3a1a08; border: 2px solid #ffd24a; box-shadow: 0 6px 18px rgba(0, 0, 0, .5), inset 0 0 0 3px rgba(160, 20, 30, .18);
    animation: cardIn .32s cubic-bezier(.2, 1.4, .4, 1) both; font-family: inherit; }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.9); } }
  .card:active { transform: scale(.97); }
  .card.evo { background: linear-gradient(180deg, #ffe8ff, #f2c1ff); border-color: #ff8cff; box-shadow: 0 0 22px rgba(255, 120, 255, .55), 0 6px 18px rgba(0, 0, 0, .5); }
  .card .art { flex: none; width: 70px; height: 70px; border-radius: 10px; background: radial-gradient(circle at 50% 40%, #5a1424, #1c050c); display: flex; align-items: center; justify-content: center; }
  .card .art svg { width: 60px; height: 60px; }
  .card h3 { font-size: 20px; color: #a3121c; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
  .card h3 em { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #a3121c; color: #ffe9a0; letter-spacing: 0; font-family: "PingFang SC", sans-serif; }
  .card.evo h3 em { background: #9b1ab8; }
  .card p { font-size: 12.5px; line-height: 1.55; margin-top: 3px; }
  .card .k { position: absolute; right: 8px; top: 6px; font-size: 11px; font-weight: 800; color: rgba(120, 40, 20, .55); }

  /* 暂停 */
  #pause { background: rgba(8, 2, 10, .72); }
  #pause h2 { font-size: 34px; letter-spacing: 8px; color: var(--gold); margin-bottom: 18px; }
  #pause button { display: block; width: 210px; margin: 8px auto; padding: 11px 0; border-radius: 10px; font-family: inherit; font-size: 17px; font-weight: 900; letter-spacing: 4px; cursor: pointer;
    border: 2px solid var(--gold); background: linear-gradient(180deg, #e8243a, #8e0618); color: #fff8d8; }
  #pause button.s { background: rgba(40, 10, 20, .9); border-color: rgba(255, 210, 74, .45); color: var(--gold2); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="hudL">
      <button class="rb" id="bSpeed" title="倍速">x1</button>
      <button class="rb" id="bMute" title="声音 (M)">♪</button>
      <button class="rb" id="bPause" title="暂停 (P)">II</button>
    </div>
    <div id="hudR">
      <div class="row1"><b class="kai" id="hStage">腊月廿九</b><span id="hTime">00:00</span></div>
      <div id="xp"><div id="xpFill"></div><div id="xpTxt">等级 1</div></div>
      <div class="row3"><span>碎鳞 <strong id="hLayers">0</strong> / 25</span><span>灭煞火 <strong id="hKills">0</strong></span></div>
    </div>
  </div>
  <div id="toast" class="kai"></div>
  <button id="ult"><div id="ultFill"></div><b class="kai">大礼花</b><small id="ultTxt">0%</small></button>

  <div class="ov" id="lvl">
    <h2 class="kai">升级</h2>
    <div class="hint">挑一样烟花加进炮阵 · 按 1 2 3 也行</div>
    <div id="slots"></div>
    <div id="cards"></div>
  </div>

  <div class="ov" id="pause">
    <h2 class="kai">歇口气</h2>
    <button id="pResume">接着放</button>
    <button class="s" id="pRestart">重新开始</button>
    <button class="s" id="pHome">回游戏厅</button>
  </div>

  <div class="ov on" id="screen"></div>
  <a id="home" href="../">‹ 游戏厅</a>
</div>
<script src="game.js"></script>
</body>
</html>
